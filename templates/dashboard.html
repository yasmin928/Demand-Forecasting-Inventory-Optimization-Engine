<!DOCTYPE html>
<html>
<head>
    <title>Inventory Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: Arial; padding: 20px; background: #f4f6f8; }

        h1 { text-align: center; }

        form {
            text-align: center;
            margin-bottom: 20px;
        }

        select, button {
            margin: 5px;
            padding: 5px;
        }

        table {
            width: 70%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th, td { padding: 10px; text-align: center; }

        th { background: black; color: white; }

        .overstock { color: orange; font-weight: bold; }
        .stockout { color: red; font-weight: bold; }
        .normal { color: green; font-weight: bold; }
    </style>
</head>

<body>

<h1>📦 Inventory Dashboard</h1>

<!-- ================= FILTERS ================= -->
<form method="get">

    <!-- STORE -->
    <select name="store">
        <option value="">All Stores</option>
        {% for s in stores %}
        <option value="{{ s }}"
            {% if selected_store == s %}selected{% endif %}>
            {{ s }}
        </option>
        {% endfor %}
    </select>

    <!-- PRODUCT -->
    <select name="product">
        <option value="">All Products</option>
        {% for p in products %}
        <option value="{{ p }}"
            {% if selected_product == p %}selected{% endif %}>
            {{ p }}
        </option>
        {% endfor %}
    </select>

    <!-- CATEGORY -->
    <select name="category">
        <option value="">All Categories</option>
        {% for c in categories %}
        <option value="{{ c }}"
            {% if selected_category == c %}selected{% endif %}>
            {{ c }}
        </option>
        {% endfor %}
    </select>

    <!-- REGION -->
    <select name="region">
        <option value="">All Regions</option>
        {% for r in regions %}
        <option value="{{ r }}"
            {% if selected_region == r %}selected{% endif %}>
            {{ r }}
        </option>
        {% endfor %}
    </select>

    <button type="submit">Apply</button>
</form>

<hr>

<!-- ================= COUNTS ================= -->
<h3>📊 Status Summary</h3>
<ul style="text-align:center;">
    <li>Overstock: {{ counts.get('Overstock', 0) }}</li>
    <li>Stockout: {{ counts.get('Stockout', 0) }}</li>
    <li>Normal: {{ counts.get('Normal', 0) }}</li>
</ul>

<!-- ================= CHART ================= -->
<div style="width:300px; margin:auto;">
    <canvas id="pieChart"></canvas>
</div>

<script>
const counts = JSON.parse('{{ counts | tojson | safe }}');

new Chart(document.getElementById("pieChart"), {
    type: 'pie',
    data: {
        labels: Object.keys(counts),
        datasets: [{
            data: Object.values(counts)
        }]
    }
});
</script>

<hr>

<!-- ================= TABLE ================= -->
<table>
<tr>
    <th>Product ID</th>
    <th>Status</th>
</tr>

{% for row in data %}
<tr>
    <td>{{ row.product_id }}</td>

    <td class="
        {% if row.status == 'Overstock' %}overstock
        {% elif row.status == 'Stockout' %}stockout
        {% else %}normal
        {% endif %}
    ">
        {{ row.status }}
    </td>
</tr>
{% endfor %}

</table>

</body>
</html>
